[project]
name = "pytailor"
version = "1.0.0"
description = "A Python formatter: ruff format, then an opinionated house style (one item per line, keyword spacing, grouped blank lines, sorted imports)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aleksandr Grin", email = "bytebrushsoftware@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["formatter", "ruff", "code style"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
# tailor's output depends on how ruff lays code out, so stay within one ruff minor version
dependencies = [
    "click>=8.1",
    "ruff>=0.16.9,<0.17",
]

[project.scripts]
tailor = "tailor:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tailor"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
